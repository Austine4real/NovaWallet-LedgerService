services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: novawallet-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - novawallet-db-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: src/NovaWallet.Api/Dockerfile
    container_name: novawallet-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__NovaWalletDb: "Server=db,1433;Database=NovaWallet;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
    ports:
      - "8080:8080"

volumes:
  novawallet-db-data:
